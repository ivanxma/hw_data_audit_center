name: Publish demo playback

on:
  push:
    branches: [main]
    paths:
      - demo/**
      - .github/workflows/demo-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}demo/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Stage public playback assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copy2

          source = Path('demo')
          destination = Path('_site/demo')
          files = (
              'index.html', 'player.css', 'player.js',
              'heatwave-audit-oci-streaming-demo.mp4',
              'captions.vtt', 'captions.srt', 'narration.txt',
              'assets/poster.jpg',
              'assets/oci-streaming-architecture.png',
              'assets/oci-streaming-architecture.drawio',
              'sql/demo-source.sql', 'sql/schema-inspection.sql',
              'sql/dcl-examples.sql',
          )
          for name in files:
              target = destination / name
              target.parent.mkdir(parents=True, exist_ok=True)
              copy2(source / name, target)
          Path('_site/index.html').write_text(
              '<!doctype html><html lang="en"><meta charset="utf-8">'
              '<meta http-equiv="refresh" content="0;url=demo/">'
              '<title>HeatWave Audit Center demo</title>'
              '<a href="demo/">Watch the five-minute demo</a></html>')
          PY
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Publish player
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
