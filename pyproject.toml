[project]
name = "heatwave-audit-center"
version = "0.1.0"
description = "HeatWave Audit Center for deployment on Oracle Linux 9"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["dependencies"]
[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
